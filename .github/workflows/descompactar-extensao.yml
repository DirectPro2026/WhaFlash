name: Descompactar extensão WhaFlash

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descompactar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar extensão
        shell: bash
        run: |
          set -e

          # Procura automaticamente qualquer ZIP enviado para a raiz.
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            if [ -f "manifest.json" ]; then
              echo "Nenhum ZIP novo encontrado. A extensão já está descompactada."
              exit 0
            fi
            echo "ERRO: nenhum arquivo ZIP encontrado na raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "Descompactando $ZIP_FILE..."

          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          # Localiza o diretório que realmente contém o manifest.json.
          MANIFEST=$(find extracted -type f -name 'manifest.json' | head -n 1)

          if [ -z "$MANIFEST" ]; then
            echo "ERRO: manifest.json não encontrado dentro do ZIP."
            exit 1
          fi

          EXT_DIR=$(dirname "$MANIFEST")
          echo "Diretório da extensão: $EXT_DIR"

          # Copia os arquivos da extensão para a raiz do repositório.
          cp -a "$EXT_DIR"/. .

          rm -rf extracted
          rm -f "$ZIP_FILE"

          echo "Extensão descompactada com sucesso."

      - name: Verificar extensão
        shell: bash
        run: |
          if [ ! -f "manifest.json" ]; then
            echo "ERRO: manifest.json não encontrado."
            exit 1
          fi

          echo "manifest.json encontrado."
          echo "Arquivos da extensão:"
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            | sort

      - name: Salvar arquivos no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Descompactar extensão WhaFlash [skip ci]"
          git push
