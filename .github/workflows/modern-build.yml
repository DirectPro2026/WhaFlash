name: Build modern extension

on:
  push:
    branches: [modern-v1]
    paths:
      - 'modern/**'
      - '.github/workflows/modern-build.yml'
  pull_request:
    paths:
      - 'modern/**'
      - '.github/workflows/modern-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Package extension
        run: zip -r whaflash-modern-test.zip dist
      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: whaflash-modern-test
          path: modern/whaflash-modern-test.zip
          if-no-files-found: error
